<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Levend haardvuur</title>
<style>
  html,body{margin:0;height:100%;background:#120804;overflow:hidden;cursor:default}
  canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #ui{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;
      padding:10px 14px;border-radius:999px;background:rgba(20,8,3,.55);backdrop-filter:blur(10px);
      color:#ffe9cf;font:14px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;transition:opacity .6s;
      box-shadow:0 6px 30px rgba(0,0,0,.35)}
  #ui.hide{opacity:0;pointer-events:none}
  #ui button{font:inherit;color:#2a1004;background:#ffcf8a;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;min-height:40px}
  #ui button.ghost{background:transparent;color:#ffe9cf;border:1px solid rgba(255,220,180,.35)}
  #ui button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  #meter{width:110px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
  #meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a1a,#ffd36e);border-radius:3px}
  #status{white-space:nowrap;opacity:.85}
  #cam{position:fixed;right:20px;bottom:20px;width:180px;border-radius:10px;transform:scaleX(-1);opacity:.85;
       display:none;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  #err{position:fixed;inset:0;display:none;place-items:center;color:#ffe9cf;font:16px system-ui;text-align:center;padding:24px}
  @media (max-width:600px){#ui{bottom:16px;gap:8px;padding:8px 10px}#meter{width:60px}#status{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted></video>
<div id="err">Je browser ondersteunt geen WebGL.</div>
<div id="ui">
  <button id="camBtn">Webcam aanzetten</button>
  <span id="status">Beweeg voor de camera</span>
  <div id="meter"><i></i></div>
  <button id="fitBtn" class="ghost" title="Hele haard / schermvullend (Z)">Hele haard</button>
  <button id="fsBtn" class="ghost" title="Volledig scherm (F)">Volledig scherm</button>
</div>

// Positions in the image (0..1, y downward)
const VS = `attribute vec2 a;varying vec2 v;void main(){v=a*.5+.5;v.y=1.-v.y;gl_Position=vec4(a,0.,1.);}`;
const FS = `
precision highp float;
varying vec2 v;
uniform sampler2D img, blurImg;
uniform vec2 res;
uniform float imgAspect, tf, act, flick, fitMode, focusY;

float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vnoise(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
vec3 ramp(float x){ // fire colour ramp
  x=clamp(x,0.,1.);
  vec3 c=mix(vec3(0.),vec3(.75,.12,.02),smoothstep(0.,.3,x));
  c=mix(c,vec3(1.,.45,.06),smoothstep(.25,.55,x));
  c=mix(c,vec3(1.,.8,.35),smoothstep(.5,.8,x));
  return mix(c,vec3(1.,.97,.85),smoothstep(.8,1.,x));
}

void main(){
  // ---- map screen to image uv (cover with focus point, or contain)
  float sa=res.x/res.y; vec2 uv=v; bool outside=false;
  if(fitMode<.5){ // cover
    if(sa>imgAspect){float hf=imgAspect/sa;float y0=clamp(focusY-hf*.5,0.,1.-hf);uv.y=y0+v.y*hf;}
    else{float wf=sa/imgAspect;uv.x=.5-wf*.5+v.x*wf;}
  }else{ // contain
    if(sa>imgAspect){float wf=sa/imgAspect;uv.x=(v.x-.5)*wf+.5;}
    else{float hf=imgAspect/sa;uv.y=(v.y-.5)*hf+.5;}
    outside=uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.;
  }
  vec2 p=uv;

  // ---- region weights for flame distortion
  float wx=smoothstep(.30,.36,p.x)*smoothstep(.75,.69,p.x);
  float wy=smoothstep(.545,.575,p.y)*smoothstep(.712,.675,p.y);
  float wlow=exp(-pow((p.y-.742)/.022,2.))*smoothstep(.37,.41,p.x)*smoothstep(.70,.66,p.x)*.4;
  float wd=max(wx*wy,wlow);
  vec3 orig=texture2D(img,p).rgb;
  wd*=mix(.3,1.,smoothstep(.3,.7,lum(orig))); // keep bricks steady, let flames dance

  // ---- domain warp the photographed flames (rising turbulence)
  float amp=mix(.007,.026,act);
  vec2 q=vec2(p.x*10.,p.y*7.+tf*1.7);
  vec2 d=vec2(fbm(q),fbm(q*1.3+vec2(5.2,1.3)))-.5;
  vec2 q2=vec2(p.x*24.,p.y*16.+tf*3.4);
  d+=.45*(vec2(fbm(q2),fbm(q2+vec2(3.1,7.7)))-.5);
  vec2 disp=vec2(d.x*amp*.9,d.y*amp*1.3+amp*.35)*wd;
  vec3 col=texture2D(img,p+disp).rgb;

  // ---- fire box mask & brightness flicker of the real flames
  float box=smoothstep(.265,.29,p.x)*smoothstep(.79,.765,p.x)*smoothstep(.548,.56,p.y)*smoothstep(.81,.79,p.y);
  float fireLum=smoothstep(.45,.85,lum(col));
  col*=1.+flick*(.10+.12*act)*fireLum*box;

  // ---- procedural flames (taller & wilder with movement)
  float baseY=.742, H=mix(.13,.215,act);
  float hgt=(baseY-p.y)/H;
  float cx=.523+(.012*(fbm(vec2(p.y*6.,tf*.7))-.5));
  float hw=mix(.13,.155,act)*(1.-.35*clamp(hgt,0.,1.));
  float dx=(p.x-cx)/hw;
  float shape=(1.-clamp(hgt,0.,1.4))*(1.-dx*dx);
  float n=fbm(vec2(p.x*13.,p.y*9.+tf*2.6))*.65+fbm(vec2(p.x*29.,p.y*21.+tf*4.6))*.35;
  float fl=clamp(shape*1.55-n*.95+.12,0.,1.);
  fl*=step(-.2,hgt);
  // logs occlude flames behind them
  float logZone=smoothstep(.672,.69,p.y)*smoothstep(.78,.76,p.y);
  fl*=mix(1.,smoothstep(.22,.55,lum(orig)),logZone);
  vec3 pf=ramp(fl)*smoothstep(.05,.35,fl);
  col=1.-(1.-col)*(1.-pf*mix(.55,.85,act)*box); // screen blend

  // ---- sparks
  vec3 spark=vec3(0.);
  for(int k=0;k<3;k++){
    float fk=float(k);
    vec2 g=vec2(70.+fk*25.,38.+fk*12.);
    vec2 sp=p*g; sp.y+=tf*(5.+fk*2.5);
    sp.x+=sin(sp.y*.35+fk*3.)*.6;
    vec2 id=floor(sp), f=fract(sp)-.5;
    float r=h21(id+fk*17.);
    float on=step(1.-mix(.015,.09,act),r);
    vec2 o=vec2(h21(id+3.1)-.5,h21(id+7.7)-.5)*.6;
    float dd=length((f-o)*vec2(1.,g.x/g.y*.6));
    float life=smoothstep(.52,.6,p.y)*smoothstep(.74,.66,p.y)*smoothstep(.35,.42,p.x)*smoothstep(.70,.63,p.x);
    float tw=.6+.4*sin(tf*20.+r*40.);
    spark+=on*life*tw*smoothstep(.18,0.,dd)*vec3(1.,.62,.22)*1.6;
  }
  col+=spark;

  // ---- glowing embers under the grate
  float emb=smoothstep(.76,.775,p.y)*smoothstep(.81,.795,p.y)*smoothstep(.30,.34,p.x)*smoothstep(.74,.70,p.x);
  float red=smoothstep(.05,.25,orig.r-orig.b);
  col*=1.+emb*red*(fbm(p*vec2(60.,90.)+vec2(0.,tf*.4))-.45)*(.9+.8*act);

  // ---- room glow follows the fire
  vec2 gd=(p-vec2(.52,.68))/vec2(.42,.30);
  float glow=exp(-dot(gd,gd));
  col*=1.+glow*(flick*(.035+.05*act)+act*.08)*(1.-box*.5);

  // ---- candles
  vec2 c1=(p-vec2(.135,.228))/vec2(.022,.022), c2=(p-vec2(.907,.236))/vec2(.022,.022), c3=(p-vec2(.882,.848))/vec2(.022,.020);
  float cm=exp(-dot(c1,c1*vec2(1.,.4)))*(vnoise(vec2(tf*3.1,1.))-.5)
          +exp(-dot(c2,c2*vec2(1.,.4)))*(vnoise(vec2(tf*2.7,5.))-.5)
          +exp(-dot(c3,c3*vec2(1.,.4)))*(vnoise(vec2(tf*3.4,9.))-.5);
  col*=1.+cm*.35;

  if(outside){
    vec2 bu=clamp(uv,0.,1.);
    col=texture2D(blurImg,clamp(v,0.,1.)).rgb*.55;
    float g2=exp(-pow((v.y-.68)/.35,2.));
    col*=1.+g2*(flick*.06+act*.1);
  }
  // vignette
  vec2 vv=v-.5; col*=1.-.35*dot(vv,vv)*1.6;
  gl_FragColor=vec4(col,1.);
}`;

const cv=document.getElementById('gl');
const gl=cv.getContext('webgl',{antialias:false,alpha:false});
if(!gl){document.getElementById('err').style.display='grid';throw new Error('no webgl');}

function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pr);gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const U={};['img','blurImg','res','imgAspect','tf','act','flick','fitMode','focusY'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));

function tex(unit,src){const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,src);return t;}

let ready=false, imgAspect=1;
const im=new Image();
im.onload=()=>{
  imgAspect=im.width/im.height;
  tex(0,im);
  const b=document.createElement('canvas');b.width=256;b.height=256;const bx=b.getContext('2d');
  bx.filter='blur(14px) saturate(1.2)';bx.drawImage(im,-30,-30,316,316);tex(1,b);
  gl.uniform1i(U.img,0);gl.uniform1i(U.blurImg,1);ready=true;
};
im.src=IMG_SRC;

let fit=0;
function resize(){const d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',resize);resize();

// ---------- motion detection
const video=document.getElementById('cam');
const mc=document.createElement('canvas');mc.width=64;mc.height=48;const mx=mc.getContext('2d',{willReadFrequently:true});
let prev=null, camOn=false, rawMotion=0, mouseMotion=0, act=.15, tf=0, flickV=0, noiseFloor=2;
const camBtn=document.getElementById('camBtn'), statusEl=document.getElementById('status'), meter=document.querySelector('#meter i');

async function startCam(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240,facingMode:'user'},audio:false});
    video.srcObject=s;await video.play();camOn=true;
    camBtn.textContent='Camerabeeld tonen';statusEl.textContent='Webcam actief — beweeg!';
  }catch(e){
    statusEl.textContent='Geen webcam — beweeg je muis';camBtn.textContent='Opnieuw proberen';
  }
}
camBtn.onclick=()=>{ if(!camOn) startCam(); else { const s=video.style.display==='block'; video.style.display=s?'none':'block'; camBtn.textContent=s?'Camerabeeld tonen':'Camerabeeld verbergen'; } };

function sampleMotion(){
  if(!camOn||video.readyState<2) return;
  mx.drawImage(video,0,0,64,48);
  const d=mx.getImageData(0,0,64,48).data;
  const g=new Float32Array(64*48);
  for(let i=0,j=0;i<d.length;i+=4,j++) g[j]=d[i]*.3+d[i+1]*.59+d[i+2]*.11;
  if(prev){
    let s=0;for(let j=0;j<g.length;j++){const df=Math.abs(g[j]-prev[j]);if(df>10)s+=df;}
    const m=s/g.length; // avg changed intensity
    noiseFloor+= (Math.min(m,noiseFloor*1.5+.5)-noiseFloor)*.01; // slowly adapt to sensor noise
    rawMotion=Math.min(1,Math.max(0,(m-noiseFloor)/14));
  }
  prev=g;
}

let lastMouse=null;
addEventListener('pointermove',e=>{
  if(lastMouse){const dd=Math.hypot(e.clientX-lastMouse[0],e.clientY-lastMouse[1]);mouseMotion=Math.min(1,mouseMotion+dd/400);}
  lastMouse=[e.clientX,e.clientY];wake();
});

// ---------- UI auto-hide, fit & fullscreen
const ui=document.getElementById('ui');let hideT;
function wake(){ui.classList.remove('hide');document.body.style.cursor='default';clearTimeout(hideT);
  hideT=setTimeout(()=>{ui.classList.add('hide');document.body.style.cursor='none';},3500);}
wake();
const fitBtn=document.getElementById('fitBtn');
function toggleFit(){fit=1-fit;fitBtn.textContent=fit?'Schermvullend':'Hele haard';}
fitBtn.onclick=toggleFit;
function toggleFS(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); else document.exitFullscreen?.(); }
document.getElementById('fsBtn').onclick=toggleFS;
cv.addEventListener('dblclick',toggleFS);
addEventListener('keydown',e=>{ if(e.key==='f'||e.key==='F') toggleFS(); if(e.key==='z'||e.key==='Z') toggleFit(); wake(); });

// ---------- loop
let last=performance.now(), mt=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  mt+=dt; if(mt>1/20){mt=0;sampleMotion();}
  mouseMotion*=Math.pow(.2,dt);
  const target=Math.max(.15,Math.min(1,.15+Math.max(rawMotion,mouseMotion)*1.1));
  act+=(target-act)*(1-Math.exp(-dt*(target>act?6:0.8))); // snel aan, rustig uitdoven
  tf+=dt*(.45+act*1.3);
  // organic flicker: sum of noisy sines, livelier with activity
  flickV=Math.sin(tf*5.1)*.5+Math.sin(tf*8.3+1.3)*.3+Math.sin(tf*13.7+2.1)*.2;
  meter.style.width=Math.round(act*100)+'%';
  if(ready){
    gl.uniform2f(U.res,cv.width,cv.height);gl.uniform1f(U.imgAspect,imgAspect);
    gl.uniform1f(U.tf,tf);gl.uniform1f(U.act,act);gl.uniform1f(U.flick,flickV);
    gl.uniform1f(U.fitMode,fit);gl.uniform1f(U.focusY,.63);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
startCam();
}
</script>
</body>
